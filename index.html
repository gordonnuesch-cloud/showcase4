<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schwingen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
  html,body{margin:0;height:100%;background:#0b0f1c;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{pointer-events:none}
  .notnagel{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .notnagel.sichtbar{position:relative;width:auto;height:auto;overflow:auto;clip-path:none;white-space:normal;
    max-width:36em;margin:0 auto;padding:2em 1.2em;color:#efe8dc;font:1.15rem/1.55 "Cormorant Garamond",Georgia,serif}
  body:has(.sichtbar){overflow:auto}
  body:has(.sichtbar) canvas{display:none}
</style>
</head>
<body>
<canvas id="himmel" aria-hidden="true"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<!--notnagel-->
<script type="module" src="/src/main.js"></script>
</body>
</html>
